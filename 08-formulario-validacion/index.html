<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 8 - validación</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <form id="form-registro" class="formulario" novalidate>
        <h2>Registro de Usuario</h2>

        <div class="campo-grupo">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Ingrese su Nombre">
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com">
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="telefono"> Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="(099) 999-999" required>
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="fecha_nac">Fecha Nacimiento</label>
            <input type="date" id="fecha_nac" name="fecha_nacimiento" required>
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="genero">Genero</label>
            <select name="genero" id="genero" required>
                <option value="">Seleccione...</option>
                <option value="femenino">Femenino</option>
                <option value="masculino">Masculino</option>
                <option value="otro">Otro</option>
            </select>
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="***********" required>
            <div id="password-strength" class="fuerza-indicador"></div>
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar_password" placeholder="************" required>
            <span class="error-mensaje"></span>
        </div>

        <div class="campo-grupo terminos">
            <label>
                <input type="checkbox" id="terminos" name="terminos" required>
                Acepta los términos y condiciones.
            </label>
            <span class="error-mensaje"></span>
        </div>

        <button type="submit" id="btn-submit">Registrarse</button>
    </form>
    <script src="js/validacion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
